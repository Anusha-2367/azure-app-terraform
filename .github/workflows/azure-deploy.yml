name: Azure Application Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_AZUREAD: true

jobs:

  # ============================================================
  # STAGE 1 - BUILD APPLICATION
  # ============================================================

  build:
    name: Stage 1 - Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore application
        working-directory: AzureApp
        run: dotnet restore

      - name: Build application
        working-directory: AzureApp
        run: dotnet build --configuration Release --no-restore

      - name: Publish application
        working-directory: AzureApp
        run: dotnet publish --configuration Release --output ./publish

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-app
          path: AzureApp/publish/


  # ============================================================
  # STAGE 2 - INFRASTRUCTURE DEPLOYMENT
  # ============================================================

  infrastructure:
    name: Stage 2 - Infrastructure Deployment
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false -reconfigure


      - name: Terraform Validate
        run: terraform validate

      # ADD THIS STEP
      - name: Create Terraform variables file
        shell: bash
        run: |
          cat > terraform.tfvars <<EOF
          resource_group_name = "Anusha-rg"
          location = "westus3"
          vnet_name = "vnet-azure-app"

          vnet_address_space = ["10.0.0.0/16"]

          public_subnet_address_prefix = "10.0.1.0/24"
          private_app_subnet_address_prefix = "10.0.2.0/24"
          private_endpoint_subnet_address_prefix = "10.0.3.0/24"

          application_insights_name = "appi-azure-app"
          key_vault_name = "kv-azure-app-demo-12345"
          private_endpoint_name = "pe-key-vault"

          sql_server_name = "sql-azure-app-demo-2"
          sql_database_name = "appdb"
          sql_database_sku_name = "S0"
          sql_location = "westus3"

          app_service_plan_name = "asp-azure-app"
          app_service_name = "app-azure-demo"
          app_service_sku = "B1"

          sql_administrator_login = "${{ secrets.SQL_ADMINISTRATOR_LOGIN }}"
          sql_administrator_password = "${{ secrets.SQL_ADMINISTRATOR_PASSWORD }}"
          EOF

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

  # ============================================================
  # STAGE 3 - APPLICATION DEPLOYMENT
  # ============================================================

  application:
    name: Stage 3 - Application Deployment
    needs: infrastructure
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: azure-app
          path: ./publish

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-azure-demo
          package: ./publish